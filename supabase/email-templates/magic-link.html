<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Your cintiQ sign-in code</title>
</head>
<body style="margin:0;padding:28px 16px;background-color:#fafaf7;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:#12161c;">
  <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width:560px;margin:0 auto;background-color:#ffffff;border:1px solid #e2e0d8;border-radius:16px;overflow:hidden;">
    <tr>
      <td style="background-color:#0e5c63;padding:22px 28px;">
        <span style="display:inline-block;font-size:22px;font-weight:700;letter-spacing:-0.02em;color:#ffffff;">
          cinti<span style="color:#e8a33d;">Q</span>
        </span>
        <span style="display:block;margin-top:4px;font-size:12px;color:#e3f0f0;">
          Your Campus. Your Marketplace.
        </span>
      </td>
    </tr>

    <tr>
      <td style="padding:28px;">
        <h1 style="margin:0 0 10px;font-size:20px;font-weight:700;color:#12161c;">
          Your cintiQ sign-in code
        </h1>
        <p style="margin:0 0 22px;font-size:14px;line-height:1.6;color:#5d6572;">
          Enter this 6-digit code to sign in to your cintiQ account:
        </p>

        <div style="background-color:#e3f0f0;border:1px solid #c5dfdf;border-radius:12px;padding:18px;text-align:center;margin:0 0 22px;">
          <span style="display:inline-block;font-size:32px;font-weight:700;letter-spacing:8px;color:#0e5c63;font-family:'Courier New',Courier,monospace;">
            {{ .Token }}
          </span>
        </div>

        <p style="margin:0;font-size:12px;line-height:1.6;color:#5d6572;">
          Or click here to sign in directly: <a href="{{ .ConfirmationURL }}" style="color:#0e5c63;font-weight:600;">Sign in to cintiQ</a>
        </p>
      </td>
    </tr>

    <tr>
      <td style="border-top:1px solid #e2e0d8;background-color:#fafaf7;padding:16px 28px;font-size:11px;color:#5d6572;text-align:center;">
        © cintiQ Campus Commerce Network
      </td>
    </tr>
  </table>
</body>
</html>
